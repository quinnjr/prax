[package]
name = "prax-orm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI tool for the Prax ORM"
documentation = "https://docs.rs/prax-orm-cli"
keywords = ["orm", "cli", "database", "migrations", "code-generation"]
categories = ["command-line-utilities", "database"]

[lib]
name = "prax_cli"
path = "src/lib.rs"

[[bin]]
name = "prax"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4.5", features = ["derive", "env", "color"] }

# Async runtime
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs"] }

# Error handling
miette = { workspace = true, features = ["fancy"] }
thiserror = { workspace = true }

# Output formatting
owo-colors = "4.1"

# Configuration
toml = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }

# Date/time for migrations
chrono = { workspace = true }

# Regex for parsing
regex-lite = { workspace = true }

# URL parsing
url = "2.5"

# UUID generation for seeding
uuid = { workspace = true, features = ["v4"] }

# Internal crates
prax-schema = { workspace = true }
prax-codegen = { workspace = true }
prax-migrate = { workspace = true }
prax-query = { workspace = true }
prax-import = { workspace = true }

# Code pretty-printing for `prax generate` output. Using prettyplease
# (same library rustc's own codegen uses) instead of shelling out to
# `cargo fmt` keeps the formatting toolchain-independent: the generator
# produces the same bytes regardless of the developer's local rustfmt
# edition. syn parses the generator's emitted string into an AST that
# prettyplease then serializes back.
syn = { version = "2.0", features = ["full", "parsing"] }
prettyplease = "0.2"

# Database drivers for introspection
tokio-postgres = { workspace = true, optional = true }
# Reused for its shared rustls connector (`prax_postgres::tls`) so `db pull`
# verifies certificates the same way the pooled engine does. Default features
# keep prax-postgres's `tls` feature on.
prax-postgres = { workspace = true, optional = true }

# Engine crates reused for cross-backend introspection (`migrate dev`/`diff`
# and `db pull`). Each is optional and enabled by the cargo feature of the
# same name; the introspectors drive the engines' raw query APIs.
prax-mysql = { workspace = true, optional = true }
prax-sqlite = { workspace = true, optional = true }
prax-mssql = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Engine crates for seeding live databases in the Docker-gated round-trip
# introspection integration tests (tests/introspect_roundtrip.rs). The test
# modules are additionally gated on the matching cargo feature.
prax-mysql = { workspace = true }
prax-sqlite = { workspace = true }
prax-mssql = { workspace = true }
prax-query = { workspace = true }

[features]
default = ["postgres", "seaorm"]
postgres = ["tokio-postgres", "prax-postgres"]
mysql = ["dep:prax-mysql"]
sqlite = ["dep:prax-sqlite"]
mssql = ["dep:prax-mssql"]
seaorm = ["prax-import/seaorm"]
